  <div class="bg-white p-4 rounded-2xl shadow-sm hover:shadow-md transition">
      <div class="flex justify-between items-start">
        <h4 class="font-semibold text-neutral-900">{{ yearData.year }}</h4>
        <span class="text-lg font-bold text-neutral-900">{{ yearData.total }}</span>
      </div>

      <!-- Mini Progress Bars -->
      <div class="mt-3 space-y-2">
        <div>
          <div class="flex justify-between text-xs text-neutral-500">
            <span>Boys ({{ yearData.boys }})</span>
            <span>{{ (yearData.boys / yearData.total! * 100) | number:'1.0-0' }}%</span>
          </div>
          <div class="w-full bg-neutral-100 rounded-full h-2">
            <div class="bg-blue-500 h-2 rounded-full"
              [style.width.%]="(yearData.boys / yearData.total! * 100)"></div>
          </div>
        </div>
        <div>
          <div class="flex justify-between text-xs text-neutral-500">
            <span>Girls ({{ yearData.girls }})</span>
            <span>{{ (yearData.girls / yearData.total! * 100) | number:'1.0-0' }}%</span>
          </div>
          <div class="w-full bg-neutral-100 rounded-full h-2">
            <div class="bg-pink-500 h-2 rounded-full"
              [style.width.%]="(yearData.girls / yearData.total! * 100)"></div>
          </div>
        </div>
      </div>
    </div>
