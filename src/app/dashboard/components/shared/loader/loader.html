@if (fullscreen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
    <div class="flex flex-col items-center gap-3">
      <div class="rounded-full animate-spin motion-reduce:animate-[spin_1.8s_linear_infinite]"
           [style.width.px]="size()"
           [style.height.px]="size()"
           [style.background]="gradientStyle()"
           [style.-webkit-mask]="maskStyle()"
           [style.mask]="maskStyle()">
      </div>
      @if (label()) {
        <p class="text-sm font-medium text-white">{{ label() }}</p>
      }
    </div>
  </div>
} @else {
  <div class="flex flex-col items-center gap-3">
    <div class="rounded-full animate-spin motion-reduce:animate-[spin_1.8s_linear_infinite]"
         [style.width.px]="size()"
         [style.height.px]="size()"
         [style.background]="gradientStyle()"
         [style.-webkit-mask]="maskStyle()"
         [style.mask]="maskStyle()">
    </div>
    @if (label()) {
      <p class="text-sm font-medium"
         [class]="labelVariant() === 'light' ? 'text-white' : 'text-neutral-500'">
        {{ label() }}
      </p>
    }
  </div>
}
