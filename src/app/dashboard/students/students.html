<div class="bg-white rounded-2xl shadow-sm overflow-hidden">
  <!-- Search bar -->
  <div class="p-6 border-b" style="border-color: var(--colorsUtilityMajor100);">
    <div class="relative max-w-md">
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-neutral-400"
           fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z" />
      </svg>
      <input type="text" [ngModel]="searchTerm()" (ngModelChange)="updateSearchTerm($event)"
             placeholder="Search by name or admission number..."
             class="w-full pl-10 pr-4 py-2.5 border rounded-lg text-sm
                    focus:outline-none focus:ring-2 focus:border-transparent transition"
             [style.borderColor]="'var(--colorsUtilityMajor200)'"
             style="--tw-ring-color: var(--colorsUtilityMajor400);">
    </div>
  </div>

  @if (loading()) {

    <div class="flex justify-center items-center p-6">
      <app-loader [size]="48" [color]="'var(--colorsUtilityMajor500)'"></app-loader>
    </div>
  } @else if (loadError()) {
    <p class="p-6 text-red-600">{{ loadError() }}</p>
  } @else {
    <app-table
      [data]="pagedStudents()"
      [columns]="columns"
      [pageSize]="pageSize()"
      [pageSizeOptions]="[10, 25, 50, 100]"
      [page]="page()"
      [totalItems]="filteredStudents().length"
      (pageChanged)="changePage($event)"
      (pageSizeChanged)="changePageSize($event)"
      [trackBy]="trackByAdmissionNo"
      emptyMessage="No students found.">

    <ng-template tableCell="status" let-student>
      <span class="px-2.5 py-1 rounded-full text-xs font-medium"
            [class]="student.active ? 'bg-green-50 text-green-600' : 'bg-neutral-100 text-neutral-500'">
        {{ student.active ? 'Active' : 'Inactive' }}
      </span>
    </ng-template>

    <!-- <ng-template tableCell="actions" let-student>
      <button (click)="viewStudent(student)"
              class="px-3 py-1.5 text-xs font-medium rounded-lg text-white transition hover:opacity-90"
              style="background: var(--colorsUtilityMajor450);">
        View
      </button>
    </ng-template> -->
    </app-table>
  }
</div>
