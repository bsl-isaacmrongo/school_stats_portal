<div class="min-h-screen flex bg-neutral-50">
  <aside class="w-64 flex-shrink-0 text-white flex flex-col" style="background: var(--gradient-hero);">
    <div class="px-6 py-6 flex items-center gap-3 border-b border-white/10">
      <div class="w-9 h-9 rounded-lg flex items-center justify-center text-xl" style="background: var(--color-secondary-500);">🏫</div>
      <span class="font-bold text-lg">BGE Admin Portal</span>
    </div>

    <nav class="flex-1 px-3 py-6 space-y-1">
      <a routerLink="/dashboard" routerLinkActive="bg-white/10 text-white" [routerLinkActiveOptions]="{ exact: true }"
         class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-neutral-300 hover:bg-white/10 hover:text-white transition">
        <span class="text-lg">📊</span> Dashboard
      </a>
      <a routerLink="/students" routerLinkActive="bg-white/10 text-white"
         class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-neutral-300 hover:bg-white/10 hover:text-white transition">
        <span class="text-lg">🎓</span> Students
      </a>
    </nav>

    <div class="px-6 py-4 text-xs text-neutral-400 border-t border-white/10">
      &copy; {{ currentYear }} Student Portal
    </div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <app-header />
    <main class="flex-1 p-6 overflow-y-auto">
      <router-outlet />
    </main>
    <app-footer />
  </div>
</div>
