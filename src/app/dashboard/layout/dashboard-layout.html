<!-- dashboard-layout.component.html -->
<div class="h-screen flex overflow-hidden bg-neutralSlate-100">
  <!-- SIDEBAR -->
  <aside class="w-64 flex-shrink-0 bg-brandPrimary-900 border-r border-brandPrimary-800 flex flex-col justify-between z-30">
    <div>
      <!-- Branding -->
      <div class="h-16 px-5 flex items-center gap-3 border-b border-brandPrimary-800/80 bg-brandPrimary-900/60">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-brandSecondary-500 to-brandSecondary-600 flex items-center justify-center text-brandPrimary-900 shadow-md font-extrabold text-lg">
          B
        </div>
        <div class="flex flex-col">
          <span class="text-sm font-bold tracking-tight text-white">BGE Admin Portal</span>
          <span class="text-[10px] uppercase font-semibold tracking-wider text-brandPrimary-300">Executive Suite</span>
        </div>
      </div>

      <!-- Navigation -->
      <nav aria-label="Main Navigation" class="p-3 space-y-1">
        <a routerLink="/dashboard" routerLinkActive="bg-brandPrimary-700/80 border border-brandPrimary-600/50 text-white shadow-sm"
           [routerLinkActiveOptions]="{ exact: true }"
           class="group flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-xs font-semibold text-brandPrimary-200 hover:text-white hover:bg-brandPrimary-800 transition-colors">
          <svg class="w-4 h-4 text-brandPrimary-300 group-hover:text-brandSecondary-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/>
          </svg>
          <span>Dashboard</span>
        </a>

        <a routerLink="/students" routerLinkActive="bg-brandPrimary-700/80 border border-brandPrimary-600/50 text-white shadow-sm"
           class="group flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-xs font-medium text-brandPrimary-200 hover:text-white hover:bg-brandPrimary-800 transition-colors">
          <svg class="w-4 h-4 text-brandPrimary-300 group-hover:text-brandSecondary-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z"/>
          </svg>
          <span>Students</span>
        </a>

        <!-- Add Analytics, Reports, Settings similarly -->
      </nav>
    </div>

    <!-- Bottom Status -->
    <div class="p-4 border-t border-brandPrimary-800/80 bg-brandPrimary-900/40">
      <div class="flex items-center gap-2 mb-2">
        <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
        <span class="text-[11px] font-medium text-brandPrimary-200">System Live • Spring '26</span>
      </div>
      <p class="text-[11px] leading-relaxed text-brandPrimary-400">
        © {{ currentYear }} Student Portal.<br/>All rights reserved.
      </p>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="flex-1 flex flex-col h-full overflow-hidden min-w-0">
    <app-header />
    <main class="flex-1 overflow-y-auto px-6 py-6 space-y-6">
      <router-outlet />
    </main>
    <app-footer />
  </div>
</div>
