<div class="min-h-screen flex items-center justify-center relative overflow-hidden bg-cover bg-center"
     style="background-image: url('/images/campus-hero.webp');">

  <!-- Overlay for readability -->
  <div class="absolute inset-0 bg-gradient-to-br from-[var(--color-primary-900)]/90 via-[var(--color-primary-800)]/80 to-[var(--color-primary-600)]/70"></div>

  <!-- Login Card -->
  <div class="relative z-10 bg-white/95 backdrop-blur-sm p-8 rounded-2xl shadow-[var(--shadow-custom-2xl)] w-full max-w-md mx-4">

    <!-- Logo & Title -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 mx-auto mb-4 rounded-2xl flex items-center justify-center text-3xl">
           <img src="/images/bge_nobg.png" alt="">
      </div>
      <h1 class="text-2xl font-bold" style="color: var(--color-primary-900);">School Dashboard</h1>
      <p class="text-neutral-500 mt-1 text-sm">Sign in to access analytics</p>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label class="block text-sm font-medium text-neutral-700 mb-1">Username</label>
        <input formControlName="username" type="text"
          class="w-full px-4 py-2.5 border border-neutral-300 rounded-lg text-neutral-900
                 focus:outline-none focus:ring-2 focus:border-transparent transition"
          style="--tw-ring-color: var(--color-tertiary-500);"
          placeholder="Enter username">
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-neutral-700 mb-1">Password</label>
        <input formControlName="password" type="password"
          class="w-full px-4 py-2.5 border border-neutral-300 rounded-lg text-neutral-900
                 focus:outline-none focus:ring-2 focus:border-transparent transition"
          style="--tw-ring-color: var(--color-tertiary-500);"
          placeholder="Enter password">
      </div>

      <div class="flex items-center justify-between mb-6">
        <label class="flex items-center cursor-pointer">
          <input type="checkbox" class="rounded border-neutral-300"
                 style="accent-color: var(--color-primary-500);">
          <span class="ml-2 text-sm text-neutral-600">Remember me</span>
        </label>
        <a href="#" class="text-sm font-medium hover:underline"
           style="color: var(--color-tertiary-600);">Forgot password?</a>
      </div>

      <button type="submit"
        [disabled]="loginForm.invalid || isLoading"
        class="w-full text-white py-2.5 px-4 rounded-lg font-medium transition
               hover:opacity-90 disabled:opacity-50 disabled:cursor-not-allowed
               shadow-[var(--shadow-custom)]"
        style="background: var(--gradient-primary);">
        {{ isLoading ? 'Signing in...' : 'Sign In' }}
      </button>

      <!-- Error Message -->
       @if(error) {
          <div class="mt-4 p-3 bg-red-50 text-red-600 rounded-lg text-sm border border-red-100">
            {{ error }}
          </div>
       }

      <!-- Demo Credentials -->
      <!-- <div class="mt-6 text-center text-sm text-neutral-500 border-t border-neutral-200 pt-4">
        <p>Demo: <strong class="text-neutral-700">admin</strong> / <strong class="text-neutral-700">admin123</strong></p>
      </div> -->
    </form>
  </div>
</div>
